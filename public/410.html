<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Removed | Verwijderd</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
        font-size: 1.125rem;
        line-height: 1.65;
        color: #32434A;
        background: #FFFFFF;
      }
      main { max-width: 36rem; }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2rem;
        line-height: 1.15;
        margin: 0 0 1rem;
      }
      p { margin: 0 0 1rem; }
      a { color: #2B6F78; text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>This page has been removed.</h1>
      <p>This address no longer exists. <a href="/">Go to the homepage</a>.</p>
      <h1>Deze pagina is verwijderd.</h1>
      <p>Dit adres bestaat niet meer. <a href="/welkom/">Ga naar de homepage</a>.</p>
    </main>
  </body>
</html>
