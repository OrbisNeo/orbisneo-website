name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # De jobnaam staat in de ruleset van main als verplichte statuscheck. Niet hernoemen.
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types en schema's (astro check)
        run: npm run check
      - name: Build, check-content en check-redirects
        run: npm run build
        env:
          CONTEXT: deploy-preview
          PUBLIC_NOINDEX: "true"
      - name: Interne links
        run: npm run check:links

  lighthouse:
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Productie-achtige build met indexering aan, zodat SEO niet door noindex wordt gedrukt.
      # CONTEXT blijft op deploy-preview: de strikte lanceercheck draait hier bewust niet.
      - name: Build
        run: npx astro build
        env:
          CONTEXT: deploy-preview
          PUBLIC_SITE_ENV: production
          PUBLIC_NOINDEX: "false"
      - name: Lighthouse mobiel
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - name: Lighthouse desktop
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.desktop.json
      - name: Rapporten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-rapporten
          path: reports
          if-no-files-found: ignore
