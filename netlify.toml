[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.production.environment]
  PUBLIC_SITE_ENV = "production"
  PUBLIC_NOINDEX = "true"
  LANG_USE_GEO = "false"

[context.deploy-preview.environment]
  PUBLIC_SITE_ENV = "preview"
  PUBLIC_NOINDEX = "true"
  LANG_USE_GEO = "false"

[context.branch-deploy.environment]
  PUBLIC_SITE_ENV = "preview"
  PUBLIC_NOINDEX = "true"
  LANG_USE_GEO = "false"

[[edge_functions]]
  function = "language"
  path = "/"

# X-Robots-Tag voor niet-productiebuilds wordt per build gegenereerd (astro.config.mjs).

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is https://unpkg.com; connect-src 'self' https://cloud.umami.is https://api.github.com https://api.netlify.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
